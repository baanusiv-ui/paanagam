name: Build Paanagam POS Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Configure Paanagam POS wrapper
        run: |
          cat > package.json <<'EOF'
          {
            "name": "paanagam-pos-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "7.4.3",
              "@capacitor/core": "7.4.3"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.3",
              "typescript": "5.8.3"
            }
          }
          EOF

          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.paanagam.businesspos',
            appName: 'Paanagam POS',
            webDir: 'www',
            server: {
              url: 'https://preview--paanagam-business-block.apper.so/pos',
              cleartext: false
            }
          };

          export default config;
          EOF

          mkdir -p www
          echo '<html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>Loading Paanagam POS...</body></html>' > www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paanagam-pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
